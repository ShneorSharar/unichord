<!doctype html><html lang="he" dir="rtl"><head>
<meta charset="utf-8">
<title>unichord · התקנת האפליקציה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../studio.css">
<style>
  .scene{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .phone{ width:330px; height:650px; }
  .a-9x16 .phone{ transform:scale(1.25); } .a-16x9 .phone{ transform:scale(.96); }
  .phone__screen{ position:absolute; inset:10px; border-radius:30px; overflow:hidden; background:var(--uc-paper); }
  .app-top{ display:flex; align-items:center; gap:10px; padding:30px 16px 12px; background:var(--uc-paper-hi); border-bottom:1px solid var(--uc-border); }
  .app-top .uc-mark{ font-size:22px; }
  .app-burger{ width:30px; display:flex; flex-direction:column; gap:5px; margin-inline-start:auto; }
  .app-burger i{ height:3px; background:var(--uc-gold); border-radius:2px; display:block; }
  .app-body{ padding:18px 16px; }
  .app-hello{ font-weight:800; font-size:21px; color:var(--uc-ink); margin-bottom:14px; }

  /* the unichord app icon tile (rounded square + Poppins mark) */
  .uc-tile{ border-radius:22%; background:var(--uc-gold); display:flex; align-items:center; justify-content:center;
            font-family:var(--uc-font-mark); font-weight:700; color:#fff; box-shadow:var(--uc-shadow-md); }
  .uc-tile span{ line-height:1; }

  /* install banner (slides up from bottom) */
  .banner{ position:absolute; left:14px; right:14px; bottom:16px; z-index:40;
           display:flex; align-items:center; gap:12px; background:var(--uc-white);
           border:1px solid var(--uc-border); border-radius:var(--uc-r-lg);
           box-shadow:var(--uc-shadow-lg); padding:13px 15px; }
  .banner .uc-tile{ width:46px; height:46px; font-size:26px; flex:0 0 46px; }
  .banner__txt{ flex:1; font-weight:700; font-size:15px; line-height:1.3; color:var(--uc-ink); }
  .banner__btn{ background:var(--uc-gold); color:#fff; font-weight:800; border:none;
                border-radius:var(--uc-r-pill); padding:9px 20px; font-size:16px; box-shadow:var(--uc-shadow-md); }

  /* home screen grid (placeholder app tiles) */
  .home{ position:absolute; inset:0; background:linear-gradient(160deg,#2a2118,#3a2e20); padding:34px 22px 22px; }
  .home__time{ text-align:center; color:#fff; font-family:var(--uc-font-mark); font-weight:700; font-size:46px; opacity:.92; margin-bottom:22px; }
  .grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px 14px; }
  .grid__cell{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .grid__ic{ width:56px; height:56px; border-radius:24%; box-shadow:0 4px 12px rgba(0,0,0,.3); }
  .grid__lbl{ font-size:11px; color:#fff; opacity:.85; }
  .grid__slot{ width:56px; height:56px; border-radius:24%; border:2px dashed rgba(255,255,255,.3); }

  /* flying app icon (animates from banner into grid slot) */
  .flyicon{ position:absolute; width:56px; height:56px; font-size:30px; z-index:60; top:0; left:0; }

  /* offline badge */
  .offline{ position:absolute; top:30px; left:14px; z-index:55; display:inline-flex; align-items:center; gap:6px;
            background:var(--uc-ink); color:#fff; border-radius:var(--uc-r-pill); padding:6px 13px;
            font-weight:700; font-size:13px; box-shadow:var(--uc-shadow-md); }
  .offline svg{ width:15px; height:15px; fill:#fff; }

  /* song view (works offline) */
  .song{ position:absolute; inset:0; background:var(--uc-paper); padding:30px 18px 18px; }
  .song__h{ font-weight:800; font-size:22px; color:var(--uc-ink); }
  .song__meta{ font-size:13px; color:var(--uc-gold-deep); margin-bottom:18px; }
  .song .ui-lyric{ font-size:21px; line-height:2.7; }

  .brandchip{ position:absolute; top:22px; right:26px; font-family:var(--uc-font-mark); font-weight:700; font-size:22px; color:var(--uc-ink); z-index:50; }
  .brandchip b{ color:var(--uc-gold); } .brandchip .d{ color:var(--uc-terracotta); }
</style></head>
<body>
<div class="stage">
  <div class="brandchip" id="brand">uni<b>chord</b><span class="d">.</span></div>
  <div class="scene">
    <div class="ui-phone phone" id="phone">
      <div class="ui-phone__notch"></div>
      <div class="phone__screen">
        <!-- app open -->
        <div class="app-top">
          <span class="uc-mark">uni<b>chord</b></span>
          <span class="app-burger"><i></i><i></i><i></i></span>
        </div>
        <div class="app-body">
          <div class="app-hello">מה מנגנים היום?</div>
          <div class="ui-lyric">
            <span class="ui-chord" data-chord="Am">אוויר</span> הרים צלול <span class="ui-chord" data-chord="Dm">כיין</span><br>
            <span class="ui-chord" data-chord="Am">וריח</span> אורנים
          </div>
        </div>

        <!-- install banner -->
        <div class="banner" id="banner">
          <div class="uc-tile"><span>u</span></div>
          <div class="banner__txt">התקינו את unichord למסך הבית</div>
          <button class="banner__btn" id="installBtn">התקן</button>
        </div>

        <!-- home screen grid -->
        <div class="home" id="homeGrid">
          <div class="home__time">9:41</div>
          <div class="grid">
            <div class="grid__cell"><div class="grid__ic" style="background:#5b8def"></div><div class="grid__lbl">דפדפן</div></div>
            <div class="grid__cell"><div class="grid__ic" style="background:#4caf72"></div><div class="grid__lbl">הודעות</div></div>
            <div class="grid__cell"><div class="grid__ic" style="background:#e0556b"></div><div class="grid__lbl">מוזיקה</div></div>
            <div class="grid__cell"><div class="grid__ic" style="background:#7a6cf0"></div><div class="grid__lbl">תמונות</div></div>
            <div class="grid__cell"><div class="grid__ic" style="background:#f2a93b"></div><div class="grid__lbl">לוח שנה</div></div>
            <div class="grid__cell"><div class="grid__slot" id="slot"></div><div class="grid__lbl">&nbsp;</div></div>
            <div class="grid__cell"><div class="grid__ic" style="background:#3fb6c4"></div><div class="grid__lbl">מזג אוויר</div></div>
            <div class="grid__cell"><div class="grid__ic" style="background:#9aa0a8"></div><div class="grid__lbl">הגדרות</div></div>
          </div>
        </div>

        <!-- offline badge -->
        <div class="offline" id="offline">
          <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5A1.5 1.5 0 0 0 11.5 2 1.5 1.5 0 0 0 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
          מצב טיסה
        </div>

        <!-- song view (works offline) -->
        <div class="song" id="song">
          <div class="song__h">ירושלים של זהב</div>
          <div class="song__meta">נעמי שמר · סולם Am · עובד אופליין</div>
          <div class="ui-lyric">
            <span class="ui-chord" data-chord="Am">אוויר</span> הרים צלול <span class="ui-chord" data-chord="Dm">כיין</span><br>
            <span class="ui-chord" data-chord="Am">וריח</span> אורנים<br>
            <span class="ui-chord" data-chord="E">נישא</span> ברוח <span class="ui-chord" data-chord="Am">הערביים</span>
          </div>
        </div>
      </div>

      <!-- flying icon (lives over the screen) -->
      <div class="uc-tile flyicon" id="appIcon"><span>u</span></div>
    </div>
  </div>
</div>

<script src="../studio.js"></script>
<script>
  // aspect from query (renderer passes ?aspect=)
  const aspect = (new URLSearchParams(location.search).get('aspect')) || '16x9';
  document.querySelector('.stage').classList.add('a-' + aspect);

  const S = Studio.create({ fps: 30, aspect });

  // hide elements that animate in
  ['banner','homeGrid','appIcon','offline','song'].forEach(id=>document.getElementById(id).classList.add('anim-init'));
  document.getElementById('homeGrid').style.opacity = 0;
  document.getElementById('song').style.opacity = 0;
  document.getElementById('offline').style.opacity = 0;

  // position the flying icon over the banner tile to start, hidden
  const appIcon = document.getElementById('appIcon');
  appIcon.style.top = '560px'; appIcon.style.left = '24px';

  // 1 — phone enters + install banner slides up
  S.track('#phone', { from: 0, to: 700, ease:'outBack', y:[50,0], opacity:[0,1] });
  S.track('#brand', { from: 200, to: 900, y:[-12,0], opacity:[0,1] });
  S.track('#banner', { from: 700, to: 1300, ease:'outBack', y:[120,0], opacity:[0,1] });
  S.caption('הוסיפו את unichord למסך הבית', 700, 2600);

  // 2 — cursor taps install button
  S.cursor([
    { x: 999, y: 999, at: 0 },
    { sel:'#installBtn', at: 1900 },
    { sel:'#installBtn', at: 2400, click: true },
    { sel:'#slot', at: 3600 },
  ]);

  // banner dismisses; home screen reveals
  S.track('#banner', { from: 2500, to: 3000, ease:'inOutCubic', y:[0,140], opacity:[1,0] });
  S.track('#homeGrid', { from: 2700, to: 3200, ease:'outCubic', opacity:[0,1] });

  // app icon flies from banner position up into the empty grid slot, settling with outBack
  S.track('#appIcon', { from: 2500, to: 2600, opacity:[0,1] });
  S.track('#appIcon', { from: 2600, to: 3500, ease:'outBack',
                        x:[0,8], y:[-330,-360], scale:[0.85,1] });
  S.caption('אפליקציה מלאה — בלי חנות אפליקציות', 2800, 5000);

  // 3 — offline badge appears, song page works
  S.track('#offline', { from: 4400, to: 4900, ease:'outBack', y:[-14,0], opacity:[0,1] });
  S.track('#song', { from: 4900, to: 5500, ease:'outCubic', x:[40,0], opacity:[0,1] });
  S.caption('ועובד מצוין גם בלי אינטרנט', 5100, 7800);
  S.track('#brand', { from: 7400, to: 8000, opacity:[1,1] }); // hold

  S.ready();
</script>
</body></html>
