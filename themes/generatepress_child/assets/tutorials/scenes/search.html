<!doctype html><html lang="he" dir="rtl"><head>
<meta charset="utf-8">
<title>unichord · חיפוש שיר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../studio.css">
<style>
  .scene{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .phone{ width:330px; height:650px; }
  .a-9x16 .phone{ transform:scale(1.25); } .a-16x9 .phone{ transform:scale(.96); }
  .phone__screen{ position:absolute; inset:10px; border-radius:30px; overflow:hidden; background:var(--uc-paper); }
  .app-top{ display:flex; align-items:center; gap:10px; padding:30px 16px 12px; background:var(--uc-paper-hi); border-bottom:1px solid var(--uc-border); }
  .app-top .uc-mark{ font-size:22px; }
  .app-burger{ width:30px; display:flex; flex-direction:column; gap:5px; margin-inline-start:auto; }
  .app-burger i{ height:3px; background:var(--uc-gold); border-radius:2px; display:block; }
  .app-body{ padding:18px 16px; }
  .app-hello{ font-weight:800; font-size:21px; color:var(--uc-ink); margin-bottom:14px; }
  .app-search{ display:flex; align-items:center; gap:8px; background:var(--uc-white); border:2px solid var(--uc-gold); border-radius:var(--uc-r-pill); padding:11px 16px; box-shadow:var(--uc-shadow-md); }
  .app-search svg{ width:20px; height:20px; fill:var(--uc-gold); flex:0 0 20px; }
  .app-search .q{ font-size:17px; color:var(--uc-ink); min-height:21px; }
  .app-search .q:empty::before{ content:"חפשו שיר…"; color:var(--uc-muted); }
  .caret{ display:inline-block; width:2px; height:18px; background:var(--uc-gold); vertical-align:-3px; margin-inline-start:1px; }
  .results{ margin-top:12px; display:flex; flex-direction:column; gap:8px; }
  .res{ display:flex; align-items:center; gap:10px; background:var(--uc-white); border:1px solid var(--uc-border); border-radius:var(--uc-r-md); padding:11px 13px; }
  .res__art{ width:38px; height:38px; border-radius:9px; background:var(--uc-gold-tint); display:flex; align-items:center; justify-content:center; font-size:20px; }
  .res__t{ font-weight:700; font-size:16px; } .res__s{ font-size:13px; color:var(--uc-ink-soft); }
  /* song overlay */
  .song{ position:absolute; inset:0; background:var(--uc-paper); padding:30px 18px 18px; }
  .song__h{ font-weight:800; font-size:22px; color:var(--uc-ink); }
  .song__meta{ font-size:13px; color:var(--uc-gold-deep); margin-bottom:18px; }
  .song .ui-lyric{ font-size:21px; line-height:2.7; }
  .brandchip{ position:absolute; top:22px; right:26px; font-family:var(--uc-font-mark); font-weight:700; font-size:22px; color:var(--uc-ink); z-index:50; }
  .brandchip b{ color:var(--uc-gold); } .brandchip .d{ color:var(--uc-terracotta); }
</style></head>
<body>
<div class="stage">
  <div class="brandchip" id="brand">uni<b>chord</b><span class="d">.</span></div>
  <div class="scene">
    <div class="ui-phone phone" id="phone">
      <div class="ui-phone__notch"></div>
      <div class="phone__screen">
        <div class="app-top">
          <span class="uc-mark">uni<b>chord</b></span>
          <span class="app-burger"><i></i><i></i><i></i></span>
        </div>
        <div class="app-body">
          <div class="app-hello">מה מנגנים היום?</div>
          <div class="app-search" id="searchbox">
            <svg viewBox="0 0 24 24"><path d="M21 20l-5.6-5.6a7 7 0 10-1.4 1.4L20 21zM5 10a5 5 0 1110 0 5 5 0 01-10 0z"/></svg>
            <span class="q" id="q"></span><span class="caret" id="caret"></span>
          </div>
          <div class="results" id="results">
            <div class="res" id="res1"><div class="res__art">🌅</div><div><div class="res__t">ירושלים של זהב</div><div class="res__s">נעמי שמר · אקורדים · תווים</div></div></div>
            <div class="res"><div class="res__art">🎵</div><div><div class="res__t">ירושלים</div><div class="res__s">להקת חיל האוויר</div></div></div>
            <div class="res"><div class="res__art">🎶</div><div><div class="res__t">של זהב</div><div class="res__s">שיר ערש</div></div></div>
          </div>
        </div>
        <!-- song view -->
        <div class="song" id="song">
          <div class="song__h">ירושלים של זהב</div>
          <div class="song__meta">נעמי שמר · סולם Am · קל לנגינה</div>
          <div class="ui-lyric">
            <span class="ui-chord" data-chord="Am">אוויר</span> הרים צלול <span class="ui-chord" data-chord="Dm">כיין</span><br>
            <span class="ui-chord" data-chord="Am">וריח</span> אורנים<br>
            <span class="ui-chord" data-chord="E">נישא</span> ברוח <span class="ui-chord" data-chord="Am">הערביים</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../studio.js"></script>
<script>
  // aspect from query (renderer passes ?aspect=)
  const aspect = (new URLSearchParams(location.search).get('aspect')) || '16x9';
  document.querySelector('.stage').classList.add('a-' + aspect);

  const S = Studio.create({ fps: 30, aspect });

  // hide elements that animate in
  ['results','song','caret'].forEach(id=>document.getElementById(id).classList.add('anim-init'));
  document.getElementById('song').style.opacity = 0;

  // 1 — phone enters
  S.track('#phone', { from: 0, to: 700, ease:'outBack', y:[50,0], opacity:[0,1] });
  S.track('#brand', { from: 200, to: 900, y:[-12,0], opacity:[0,1] });
  S.caption('מחפשים שיר? פשוט מתחילים להקליד', 250, 2400);

  // 2 — type the query
  S.track('#caret', { from: 850, to: 950, opacity:[0,1] });
  S.type('#q', 'ירושלים של זהב', 1000, 2300);

  // 3 — results appear, staggered
  S.track('#results', { from: 2350, to: 2700, opacity:[0,1] });
  S.track('.res', { from: 2400, to: 2750, ease:'outCubic', y:[16,0], opacity:[0,1], stagger:90 });
  S.caption('התוצאות מופיעות תוך כדי הקלדה — בלי הרשמה', 2600, 4100);

  // 4 — cursor picks the first result
  S.cursor([
    { x: 999, y: 999, at: 0 },           // parked off-screen-ish (resolved as raw)
    { sel:'#searchbox', at: 900 },
    { sel:'#searchbox', at: 2300 },
    { sel:'#res1', at: 3300, click: true },
  ]);

  // 5 — song view slides in
  S.track('#song', { from: 3450, to: 3950, ease:'outCubic', x:[40,0], opacity:[0,1] });
  S.caption('וזהו — אקורדים, מילים ותווים. חינם, לתמיד.', 4000, 6200);
  S.track('#brand', { from: 5800, to: 6400, opacity:[1,1] }); // hold

  S.ready();
</script>
</body></html>
