<!doctype html><html lang="he" dir="rtl"><head>
<meta charset="utf-8">
<title>unichord · לימוד אקורדים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../studio.css">
<style>
  .scene{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .phone{ width:330px; height:650px; }
  .a-9x16 .phone{ transform:scale(1.25); } .a-16x9 .phone{ transform:scale(.96); }
  .phone__screen{ position:absolute; inset:10px; border-radius:30px; overflow:hidden; background:var(--uc-paper); }
  .app-top{ display:flex; align-items:center; gap:10px; padding:30px 16px 12px; background:var(--uc-paper-hi); border-bottom:1px solid var(--uc-border); }
  .app-top .uc-mark{ font-size:22px; }
  .app-burger{ width:30px; display:flex; flex-direction:column; gap:5px; margin-inline-start:auto; }
  .app-burger i{ height:3px; background:var(--uc-gold); border-radius:2px; display:block; }
  .app-body{ padding:18px 16px; display:flex; flex-direction:column; align-items:center; }

  /* chord diagram card */
  .chord-card{ width:100%; background:var(--uc-white); border:1px solid var(--uc-border); border-radius:var(--uc-r-md); box-shadow:var(--uc-shadow-md); padding:16px 16px 18px; text-align:center; }
  .chord-card__title{ font-family:var(--uc-font-mark); font-weight:700; font-size:24px; color:var(--uc-gold); margin-bottom:10px; }
  .fretboard{ display:block; margin:0 auto; }

  /* instruction */
  .instr{ margin-top:16px; font-weight:800; font-size:18px; color:var(--uc-ink); }

  /* mic listening */
  .listen{ margin-top:18px; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .mic{ width:46px; height:46px; border-radius:50%; background:var(--uc-gold-tint); display:flex; align-items:center; justify-content:center; box-shadow:var(--uc-shadow-md); }
  .mic svg{ width:24px; height:24px; fill:var(--uc-gold-deep); }
  .wave{ display:flex; align-items:center; gap:6px; height:54px; }
  .bar{ width:7px; height:46px; border-radius:var(--uc-r-pill); background:var(--uc-gold); transform-origin:center; transform:scaleY(.18); }

  /* success badge */
  .badge{ margin-top:18px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .badge__ring{ width:64px; height:64px; border-radius:50%; background:#2e9e5b; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 22px rgba(46,158,91,.35); }
  .badge__ring svg{ width:34px; height:34px; fill:none; stroke:#fff; stroke-width:3.4; stroke-linecap:round; stroke-linejoin:round; }
  .badge__txt{ font-weight:800; font-size:19px; color:#2e9e5b; }

  .brandchip{ position:absolute; top:22px; right:26px; font-family:var(--uc-font-mark); font-weight:700; font-size:22px; color:var(--uc-ink); z-index:50; }
  .brandchip b{ color:var(--uc-gold); } .brandchip .d{ color:var(--uc-terracotta); }
</style></head>
<body>
<div class="stage">
  <div class="brandchip" id="brand">uni<b>chord</b><span class="d">.</span></div>
  <div class="scene">
    <div class="ui-phone phone" id="phone">
      <div class="ui-phone__notch"></div>
      <div class="phone__screen">
        <div class="app-top">
          <span class="uc-mark">uni<b>chord</b></span>
          <span class="app-burger"><i></i><i></i><i></i></span>
        </div>
        <div class="app-body">

          <!-- chord diagram card -->
          <div class="chord-card" id="card">
            <div class="chord-card__title">אקורד Am</div>
            <svg class="fretboard" viewBox="0 0 160 150" width="160" height="150">
              <!-- frets (4 horizontal) -->
              <g stroke="var(--uc-border-strong)" stroke-width="2">
                <line x1="20" y1="30"  x2="140" y2="30"/>
                <line x1="20" y1="60"  x2="140" y2="60"/>
                <line x1="20" y1="90"  x2="140" y2="90"/>
                <line x1="20" y1="120" x2="140" y2="120"/>
              </g>
              <!-- nut (top, thicker) -->
              <line x1="20" y1="30" x2="140" y2="30" stroke="var(--uc-ink)" stroke-width="5"/>
              <!-- strings (6 vertical) -->
              <g stroke="var(--uc-border-strong)" stroke-width="2">
                <line x1="20"  y1="30" x2="20"  y2="120"/>
                <line x1="44"  y1="30" x2="44"  y2="120"/>
                <line x1="68"  y1="30" x2="68"  y2="120"/>
                <line x1="92"  y1="30" x2="92"  y2="120"/>
                <line x1="116" y1="30" x2="116" y2="120"/>
                <line x1="140" y1="30" x2="140" y2="120"/>
              </g>
              <!-- open / muted markers above nut: Am = X o o o (low E muted, A & high E open) -->
              <text x="20"  y="18" text-anchor="middle" font-size="13" fill="var(--uc-ink-soft)" font-family="Poppins,sans-serif">x</text>
              <text x="44"  y="18" text-anchor="middle" font-size="13" fill="var(--uc-ink-soft)" font-family="Poppins,sans-serif">o</text>
              <text x="140" y="18" text-anchor="middle" font-size="13" fill="var(--uc-ink-soft)" font-family="Poppins,sans-serif">o</text>
              <!-- finger dots: Am = D-string 2nd fret, G-string 2nd fret, B-string 1st fret -->
              <circle cx="68"  cy="45" r="9" fill="var(--uc-gold)"/>      <!-- B string, 1st fret -->
              <circle cx="92"  cy="75" r="9" fill="var(--uc-gold)"/>      <!-- G string, 2nd fret -->
              <circle cx="116" cy="75" r="9" fill="var(--uc-gold)"/>      <!-- D string, 2nd fret -->
            </svg>
          </div>

          <!-- instruction -->
          <div class="instr" id="instr">נגנו את האקורד Am 🎸</div>

          <!-- mic listening -->
          <div class="listen" id="listen">
            <div class="mic" id="mic">
              <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 003-3V6a3 3 0 00-6 0v5a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-3.08A7 7 0 0019 11h-2z"/></svg>
            </div>
            <div class="wave" id="wave">
              <span class="bar" id="b0"></span>
              <span class="bar" id="b1"></span>
              <span class="bar" id="b2"></span>
              <span class="bar" id="b3"></span>
              <span class="bar" id="b4"></span>
              <span class="bar" id="b5"></span>
              <span class="bar" id="b6"></span>
            </div>
          </div>

          <!-- success badge -->
          <div class="badge" id="badge">
            <div class="badge__ring">
              <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
            </div>
            <div class="badge__txt">מעולה! זוהה Am</div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<script src="../studio.js"></script>
<script>
  // aspect from query (renderer passes ?aspect=)
  const aspect = (new URLSearchParams(location.search).get('aspect')) || '16x9';
  document.querySelector('.stage').classList.add('a-' + aspect);

  const S = Studio.create({ fps: 30, aspect });

  // hide elements that animate in
  ['card','instr','listen','badge'].forEach(id=>document.getElementById(id).classList.add('anim-init'));
  document.getElementById('badge').style.opacity = 0;

  // 1 — phone + brand + card enter
  S.track('#phone', { from: 0,   to: 700, ease:'outBack', y:[50,0], opacity:[0,1] });
  S.track('#brand', { from: 200, to: 900, y:[-12,0], opacity:[0,1] });
  S.track('#card',  { from: 350, to: 950, ease:'outBack', scale:[.85,1], opacity:[0,1] });
  S.track('#instr', { from: 700, to: 1200, y:[12,0], opacity:[0,1] });

  // 2 — mic listening UI appears, then the engine "listens"
  S.track('#listen', { from: 1150, to: 1600, y:[12,0], opacity:[0,1] });
  S.caption('המנוע מקשיב לנגינה שלכם', 1300, 3300);

  // mic pulse — up then down, repeated via paired tracks
  const micT = [1500, 2000, 2500, 3000, 3500, 4000, 4500];
  micT.forEach((t,i)=>{
    S.track('#mic', { from: t,     to: t+250, ease:'inOutQuad', scale: i%2? [1.12,1] : [1,1.12] });
  });

  // 3 — waveform: each bar oscillates with its own overlapping up/down tracks.
  // values vary per bar so it reads as a lively, organic waveform while "listening".
  const bars = ['#b0','#b1','#b2','#b3','#b4','#b5','#b6'];
  // amplitude pattern per bar (peak scaleY) and baseline (resting scaleY)
  const peaks = [0.75, 1.0, 0.55, 0.9, 0.6, 1.0, 0.7];
  const base  = 0.18;
  bars.forEach((sel,i)=>{
    let t = 1500 + i*60;           // staggered start
    let toggle = true;
    while (t < 5200){
      const dur = 180 + (i%3)*40;  // slightly different rhythm per bar
      const pk  = peaks[i] * (toggle ? 1 : 0.7);
      if (toggle) S.track(sel, { from: t, to: t+dur, ease:'outQuad',   scale:[base, pk] });
      else        S.track(sel, { from: t, to: t+dur, ease:'inOutQuad', scale:[pk,  base] });
      t += dur; toggle = !toggle;
    }
  });
  S.caption('ומאשר את האקורד בזמן אמת', 3400, 5200);

  // 4 — resolution: bars settle to baseline, listening fades, success badge pops
  bars.forEach((sel,i)=> S.track(sel, { from: 5200, to: 5550, ease:'outCubic', scale:[ peaks[i], base ] }) );
  S.track('#listen', { from: 5350, to: 5800, opacity:[1,0], y:[0,-8] });
  S.track('#badge',  { from: 5650, to: 6300, ease:'outBack', scale:[0,1], opacity:[0,1] });
  S.caption('לומדים אקורדים בדפדפן — בלי התקנה', 5900, 7500);
  S.track('#brand', { from: 7000, to: 7500, opacity:[1,1] }); // hold

  S.ready();
</script>
</body></html>
