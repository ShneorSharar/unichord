<!doctype html><html lang="he" dir="rtl"><head>
<meta charset="utf-8">
<title>unichord · עורך האקורדים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../studio.css">
<style>
  .scene{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .phone{ width:330px; height:650px; }
  .a-9x16 .phone{ transform:scale(1.25); } .a-16x9 .phone{ transform:scale(.96); }
  .phone__screen{ position:absolute; inset:10px; border-radius:30px; overflow:hidden; background:var(--uc-paper); }
  .app-top{ display:flex; align-items:center; gap:10px; padding:30px 16px 12px; background:var(--uc-paper-hi); border-bottom:1px solid var(--uc-border); }
  .app-top .uc-mark{ font-size:22px; }
  .app-burger{ width:30px; display:flex; flex-direction:column; gap:5px; margin-inline-start:auto; }
  .app-burger i{ height:3px; background:var(--uc-gold); border-radius:2px; display:block; }
  .app-body{ padding:16px 16px; }
  .edit-title{ font-weight:800; font-size:20px; color:var(--uc-ink); margin-bottom:4px; }
  .edit-sub{ font-size:13px; color:var(--uc-gold-deep); margin-bottom:16px; }

  /* lyric line rendered as word tokens */
  .lyric-line{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:4px 8px; padding:14px 10px 18px; background:var(--uc-white); border:1px solid var(--uc-border); border-radius:var(--uc-r-md); box-shadow:var(--uc-shadow-md); }
  .tok{ position:relative; font-size:22px; line-height:1.7; color:var(--uc-ink); padding:2px 2px; border-radius:6px; }
  /* gold chord label that drops above a word */
  .wchord{ position:absolute; bottom:100%; right:0; margin-bottom:2px; font-family:var(--uc-font-mark); font-weight:800; font-size:15px; color:var(--uc-gold); white-space:nowrap; }

  /* palette row of draggable chord chips */
  .palette{ margin-top:18px; display:flex; flex-wrap:wrap; gap:9px; padding:12px 10px; background:var(--uc-gold-tint); border-radius:var(--uc-r-md); border:1px dashed var(--uc-border-strong); }
  .palette-label{ width:100%; font-size:12px; font-weight:700; color:var(--uc-gold-deep); margin-bottom:2px; }
  .palchip{ font-family:var(--uc-font-mark); font-weight:700; font-size:17px; color:var(--uc-gold); background:var(--uc-white); border:1.5px solid var(--uc-gold); border-radius:var(--uc-r-pill); padding:6px 14px; box-shadow:var(--uc-shadow-md); }

  /* flying ghost chips (clones that travel) */
  .ghost{ position:absolute; z-index:40; font-family:var(--uc-font-mark); font-weight:700; font-size:17px; color:var(--uc-gold); background:var(--uc-white); border:1.5px solid var(--uc-gold); border-radius:var(--uc-r-pill); padding:6px 14px; box-shadow:var(--uc-shadow-lg); pointer-events:none; }
  #ghostAm{ top:430px; right:18px; }
  #ghostG{ top:430px; right:78px; }

  /* preview card at bottom */
  .preview{ position:absolute; left:14px; right:14px; bottom:16px; background:var(--uc-white); border:1px solid var(--uc-border); border-radius:var(--uc-r-md); box-shadow:var(--uc-shadow-lg); padding:12px 14px; }
  .preview__h{ font-size:12px; font-weight:800; color:var(--uc-gold-deep); margin-bottom:8px; }
  .preview .ui-lyric{ font-size:20px; line-height:2.6; }

  .brandchip{ position:absolute; top:22px; right:26px; font-family:var(--uc-font-mark); font-weight:700; font-size:22px; color:var(--uc-ink); z-index:50; }
  .brandchip b{ color:var(--uc-gold); } .brandchip .d{ color:var(--uc-terracotta); }
</style></head>
<body>
<div class="stage">
  <div class="brandchip" id="brand">uni<b>chord</b><span class="d">.</span></div>
  <div class="scene">
    <div class="ui-phone phone" id="phone">
      <div class="ui-phone__notch"></div>
      <div class="phone__screen">
        <div class="app-top">
          <span class="uc-mark">uni<b>chord</b></span>
          <span class="app-burger"><i></i><i></i><i></i></span>
        </div>
        <div class="app-body">
          <div class="edit-title">עריכת אקורדים</div>
          <div class="edit-sub">ירושלים של זהב · תרומת שיר</div>

          <div class="lyric-line" id="lyricline">
            <span class="tok" id="w1">אוויר<span class="wchord" id="wc1">Am</span></span>
            <span class="tok">הרים</span>
            <span class="tok">צלול</span>
            <span class="tok" id="w2">כיין<span class="wchord" id="wc2">G</span></span>
            <span class="tok">וריח</span>
            <span class="tok">אורנים</span>
          </div>

          <div class="palette" id="palette">
            <span class="palette-label">גררו אקורד מהפלטה</span>
            <span class="palchip" id="palAm">Am</span>
            <span class="palchip">C</span>
            <span class="palchip" id="palG">G</span>
            <span class="palchip">D</span>
            <span class="palchip">Em</span>
            <span class="palchip">F</span>
          </div>
        </div>

        <!-- flying ghost chips -->
        <div class="ghost" id="ghostAm">Am</div>
        <div class="ghost" id="ghostG">G</div>

        <!-- preview card -->
        <div class="preview" id="preview">
          <div class="preview__h">תצוגה מקדימה</div>
          <div class="ui-lyric">
            <span class="ui-chord" data-chord="Am">אוויר</span> הרים צלול <span class="ui-chord" data-chord="G">כיין</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../studio.js"></script>
<script>
  // aspect from query (renderer passes ?aspect=)
  const aspect = (new URLSearchParams(location.search).get('aspect')) || '16x9';
  document.querySelector('.stage').classList.add('a-' + aspect);

  const S = Studio.create({ fps: 30, aspect });

  // hide elements that animate in
  ['palette','wc1','wc2','ghostAm','ghostG','preview'].forEach(id=>document.getElementById(id).classList.add('anim-init'));
  document.getElementById('preview').style.opacity = 0;

  // 1 — phone + editor enter
  S.track('#phone', { from: 0, to: 700, ease:'outBack', y:[50,0], opacity:[0,1] });
  S.track('#brand', { from: 200, to: 900, y:[-12,0], opacity:[0,1] });
  S.track('#lyricline', { from: 300, to: 800, y:[14,0], opacity:[1,1] });
  S.track('#palette', { from: 500, to: 1000, ease:'outCubic', y:[18,0], opacity:[0,1] });
  S.caption('תרמו שיר — גוררים אקורד מעל מילה', 400, 3000);

  // 2 — INTERACTION 1: cursor to Am, lift, fly to #w1, drop, reveal chord
  S.cursor([
    { x: 999, y: 999, at: 0 },
    { sel:'#palAm', at: 1100 },
    { sel:'#ghostAm', at: 2050 },   // follow the chip as it travels
    { sel:'#w1', at: 2400, click: true },
    { sel:'#palG', at: 3600 },
    { sel:'#ghostG', at: 4550 },
    { sel:'#w2', at: 4900, click: true },
    { sel:'#preview', at: 6300 },
  ]);

  // ghost Am: lift off palette, travel up-left to above #w1, settle
  S.track('#ghostAm', { from: 1200, to: 1350, opacity:[0,1], scale:[1,1.12] });           // lift
  S.track('#ghostAm', { from: 1350, to: 2300, ease:'outCubic', x:[0,-150], y:[0,-330] }); // travel to w1
  S.track('#ghostAm', { from: 2300, to: 2520, ease:'outBack', scale:[1.12,1] });          // drop settle
  S.track('#ghostAm', { from: 2540, to: 2660, opacity:[1,0] });                            // fade ghost
  // permanent gold chord label appears on the word
  S.track('#wc1', { from: 2480, to: 2780, ease:'outBack', y:[8,0], opacity:[0,1] });

  // 3 — INTERACTION 2: G chip onto #w2
  S.caption('האקורד ננעל בדיוק במקום', 3100, 5400);
  S.track('#ghostG', { from: 3700, to: 3850, opacity:[0,1], scale:[1,1.12] });            // lift
  S.track('#ghostG', { from: 3850, to: 4800, ease:'outCubic', x:[0,-78], y:[0,-330] });   // travel to w2
  S.track('#ghostG', { from: 4800, to: 5020, ease:'outBack', scale:[1.12,1] });           // drop settle
  S.track('#ghostG', { from: 5040, to: 5160, opacity:[1,0] });                             // fade ghost
  S.track('#wc2', { from: 4980, to: 5280, ease:'outBack', y:[8,0], opacity:[0,1] });

  // 4 — preview card fades to show the result line
  S.track('#preview', { from: 5800, to: 6400, ease:'outCubic', y:[20,0], opacity:[0,1] });
  S.caption('כל אחד יכול לתרום — חינם וקוד פתוח', 6300, 8500);
  S.track('#brand', { from: 8000, to: 8500, opacity:[1,1] }); // hold

  S.ready();
</script>
</body></html>
